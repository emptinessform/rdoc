<!doctype html>
<meta charset="utf-8">
<title>rdoc editor (wasm)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #4a4f57; margin: 0; }
  header { background: #2b2e33; color: #eee; position: sticky; top: 0; z-index: 3; }

  /* ---- menubar ---- */
  #menubar { display: flex; align-items: center; gap: 2px; padding: 4px 10px 0;
    border-bottom: 1px solid #3a3e45; flex-wrap: wrap; }
  #menubar .brand { font-size: 15px; font-weight: 700; margin: 0 12px 0 4px; color: #fff; }
  .menu { position: relative; }
  .menu > .mtitle { background: none; border: 0; color: #ddd; font: inherit;
    font-size: 13px; padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: default; }
  .menu.open > .mtitle, .menu > .mtitle:hover { background: #3a3e45; color: #fff; }
  .mlist { display: none; position: absolute; left: 0; top: 100%; min-width: 230px;
    background: #33363c; border: 1px solid #4a4f57; border-radius: 0 8px 8px 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); padding: 6px; z-index: 4; }
  .menu.open > .mlist { display: block; }
  .mlist button { display: flex; width: 100%; align-items: center; gap: 10px;
    background: none; border: 0; color: #eee; font: inherit; font-size: 13px;
    padding: 6px 10px; border-radius: 5px; text-align: left; cursor: default; }
  .mlist button:hover { background: #1a73e8; color: #fff; }
  .mlist button:hover kbd { color: #cfe0ff; }
  .mlist kbd { margin-left: auto; font: 11px ui-monospace, monospace; color: #9aa0a8; }
  .mlist hr { border: 0; border-top: 1px solid #454a52; margin: 5px 4px; }
  #status { margin-left: auto; color: #9fd49f; font-size: 12px; padding: 6px 4px; }

  /* ---- toolbar ---- */
  #toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    flex-wrap: wrap; }
  #toolbar .sep { width: 1px; height: 20px; background: #454a52; margin: 0 4px; }
  #toolbar button, #toolbar select, #toolbar input[type=number] {
    background: #3a3e45; color: #eee; border: 1px solid #4a4f57; border-radius: 6px;
    font: inherit; font-size: 13px; padding: 3px 9px; }
  #toolbar button:hover { background: #4a4f57; }
  #toolbar button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #toolbar button b, #toolbar button i, #toolbar button u { pointer-events: none; }
  #toolbar input[type=color] { width: 26px; height: 24px; padding: 1px;
    border: 1px solid #4a4f57; border-radius: 6px; background: #3a3e45; }
  #toolbar label { font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 5px; }
  #findbar, #linkbar { display: flex; align-items: center; gap: 4px; }
  #findbar[hidden], #linkbar[hidden] { display: none; }
  #findbar input, #linkbar input { background: #23262b; color: #eee; border: 1px solid #4a4f57;
    border-radius: 6px; font: inherit; font-size: 13px; padding: 3px 8px; }
  #findcount { font-size: 12px; color: #9aa0a8; }

  #pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px; }
  #pages svg { background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.45); height: auto; cursor: text; user-select: none; }
  #thumbs { position: fixed; left: 0; top: 76px; bottom: 0; width: 132px;
    overflow-y: auto; background: #33363c; padding: 10px 8px; z-index: 1;
    display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #thumbs img { width: 108px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
    cursor: pointer; display: block; }
  #thumbs .cur { outline: 2px solid #1a73e8; }
  #thumbs .pageno { color: #aaa; font-size: 11px; margin: -4px 0 2px; }
  body.thumbs-open #pages { margin-left: 132px; }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<header>
  <div id="menubar">
    <span class="brand">rdoc</span>
    <div class="menu">
      <button class="mtitle">파일</button>
      <div class="mlist">
        <button id="demo">데모 문서 열기</button>
        <button data-cmd="openFile">열기…</button>
        <hr>
        <button id="save">.docx로 저장</button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle">편집</button>
      <div class="mlist">
        <button data-cmd="undo">실행 취소<kbd>Ctrl+Z</kbd></button>
        <button data-cmd="redo">다시 실행<kbd>Ctrl+Y</kbd></button>
        <hr>
        <button data-cmd="cut">잘라내기<kbd>Ctrl+X</kbd></button>
        <button data-cmd="copy">복사<kbd>Ctrl+C</kbd></button>
        <button data-cmd="paste">붙여넣기<kbd>Ctrl+V</kbd></button>
        <button data-cmd="selectAll">모두 선택<kbd>Ctrl+A</kbd></button>
        <hr>
        <button data-cmd="find">찾기<kbd>Ctrl+F</kbd></button>
        <button data-cmd="replace">바꾸기<kbd>Ctrl+H</kbd></button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle">삽입</button>
      <div class="mlist">
        <button data-cmd="insertImage">이미지…</button>
        <button data-cmd="link">하이퍼링크…<kbd>Ctrl+K</kbd></button>
        <button data-cmd="unlink">링크 제거</button>
        <hr>
        <button data-cmd="footnote">각주<kbd>Ctrl+Alt+F</kbd></button>
        <button data-cmd="endnote">미주<kbd>Ctrl+Alt+E</kbd></button>
        <button data-cmd="deleteNote">각주/미주 삭제<kbd>Ctrl+Alt+D</kbd></button>
        <hr>
        <button data-cmd="rowAdd">아래에 행 추가</button>
        <button data-cmd="rowDel">행 삭제</button>
        <button data-cmd="colAdd">오른쪽에 열 추가</button>
        <button data-cmd="colDel">열 삭제</button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle">서식</button>
      <div class="mlist">
        <button data-cmd="bold">굵게<kbd>Ctrl+B</kbd></button>
        <button data-cmd="italic">기울임<kbd>Ctrl+I</kbd></button>
        <button data-cmd="underline">밑줄<kbd>Ctrl+U</kbd></button>
        <hr>
        <button data-cmd="alignL">왼쪽 정렬<kbd>Ctrl+L</kbd></button>
        <button data-cmd="alignC">가운데 정렬<kbd>Ctrl+E</kbd></button>
        <button data-cmd="alignR">오른쪽 정렬<kbd>Ctrl+R</kbd></button>
        <hr>
        <button data-cmd="listBullet">글머리표 목록</button>
        <button data-cmd="listNumber">번호 목록<kbd>Tab: 수준</kbd></button>
        <hr>
        <button data-cmd="spacing1">줄 간격 1.0</button>
        <button data-cmd="spacing15">줄 간격 1.5</button>
        <button data-cmd="spacing2">줄 간격 2.0</button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle">보기</button>
      <div class="mlist">
        <button id="thumbtoggle">페이지 목록</button>
      </div>
    </div>
    <span id="status">loading wasm…</span>
  </div>
  <div id="toolbar">
    <span id="fmtbtns">
      <button data-fmt="b" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button data-fmt="i" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button data-fmt="u" title="밑줄 (Ctrl+U)"><u>U</u></button>
    </span>
    <span id="alignbtns">
      <button data-align="l" title="왼쪽 정렬 (Ctrl+L)">⮜</button>
      <button data-align="c" title="가운데 정렬 (Ctrl+E)">⬌</button>
      <button data-align="r" title="오른쪽 정렬 (Ctrl+R)">⮞</button>
    </span>
    <span id="listbtns">
      <button data-list="bullet" title="글머리표 목록 (Tab/Shift+Tab: 수준)">•¶</button>
      <button data-list="number" title="번호 목록 (Tab/Shift+Tab: 수준)">1.</button>
    </span>
    <span class="sep"></span>
    <select id="fontfamily" title="글꼴 (선택 범위)">
      <option value="" selected disabled>글꼴</option>
      <option value="Pretendard">Pretendard</option>
      <option value="맑은 고딕">맑은 고딕</option>
      <option value="나눔명조">나눔명조</option>
      <option value="굴림">굴림</option>
      <option value="돋움">돋움</option>
      <option value="바탕">바탕</option>
    </select>
    <label title="글자 크기 (pt)">크기
      <input type="number" id="fontsize" min="6" max="96" step="1" style="width:3.4em" placeholder="pt">
    </label>
    <input type="color" id="fontcolor" value="#c00000" title="글자 색 (선택 범위)">
    <select id="linespacing" title="줄 간격 (문단)">
      <option value="" selected disabled>줄간격</option>
      <option value="1">1.0</option>
      <option value="1.15">1.15</option>
      <option value="1.5">1.5</option>
      <option value="2">2.0</option>
    </select>
    <select id="parastyle" title="문단 스타일">
      <option value="" selected disabled>스타일</option>
      <option value="Normal">본문</option>
      <option value="Heading1">제목 1</option>
      <option value="Heading2">제목 2</option>
      <option value="Heading3">제목 3</option>
    </select>
    <span class="sep"></span>
    <span id="tblbtns" title="표: 캐럿 셀 기준">
      <button data-op="r" title="아래에 행 추가">행+</button>
      <button data-op="R" title="행 삭제">행−</button>
      <button data-op="c" title="오른쪽에 열 추가">열+</button>
      <button data-op="C" title="열 삭제">열−</button>
    </span>
    <span class="sep"></span>
    <button id="imgbtn" title="이미지 삽입 (캐럿 위치)">이미지</button>
    <input type="file" id="imgfile" accept="image/*" style="display:none">
    <input type="file" id="file" accept=".docx" style="display:none">
    <span class="sep"></span>
    <label>zoom <select id="zoom">
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select></label>
    <span id="linkbar" hidden>
      <span class="sep"></span>
      <input id="linkq" placeholder="https://…" autocomplete="off" size="24">
      <button id="linkapply" title="링크 적용 (Enter)">링크</button>
      <button id="linkremove" title="링크 제거">해제</button>
      <button id="linkclose" title="닫기 (Esc)">✕</button>
    </span>
    <span id="findbar" hidden>
      <span class="sep"></span>
      <input id="findq" placeholder="찾기" autocomplete="off" size="14">
      <span id="findcount"></span>
      <button id="findprev" title="이전 (Shift+Enter)">▲</button>
      <button id="findnext" title="다음 (Enter)">▼</button>
      <input id="replq" placeholder="바꾸기" autocomplete="off" size="12">
      <button id="replone" title="현재 매치 바꾸기">바꾸기</button>
      <button id="replall" title="모두 바꾸기">모두</button>
      <button id="findclose" title="닫기 (Esc)">✕</button>
    </span>
  </div>
</header>
<div id="thumbs" hidden></div>
<div id="pages"></div>
<input id="ime" autocomplete="off" style="position:fixed; top:0; left:-9999px; width:100px; opacity:0">
<script type="module" src="./js/main.js"></script>
