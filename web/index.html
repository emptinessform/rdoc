<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rdoc editor (wasm)</title>
<style>
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; background: #4a4f57; margin: 0;
    display: flex; flex-direction: column; overflow: hidden; }
  header { background: #2b2e33; color: #eee; flex: none; z-index: 3; }
  /* The app row: an in-flow thumbnail panel plus the scrolling document
     area — the panel occupies its own column and can never cover pages. */
  #app { flex: 1; display: flex; min-height: 0; }
  #main { flex: 1; overflow: auto; min-width: 0; }

  /* ---- menubar ---- */
  #menubar { display: flex; align-items: center; gap: 2px; padding: 4px 10px 0;
    border-bottom: 1px solid #3a3e45; flex-wrap: wrap; }
  #menubar .brand { font-size: 15px; font-weight: 700; margin: 0 12px 0 4px; color: #fff; }
  .menu { position: relative; }
  .menu > .mtitle { background: none; border: 0; color: #ddd; font: inherit;
    font-size: 13px; padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: default; }
  .menu.open > .mtitle, .menu > .mtitle:hover { background: #3a3e45; color: #fff; }
  .mlist { display: none; position: absolute; left: 0; top: 100%; min-width: 230px;
    background: #33363c; border: 1px solid #4a4f57; border-radius: 0 8px 8px 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); padding: 6px; z-index: 4; }
  .menu.open > .mlist { display: block; }
  .mlist button { display: flex; width: 100%; align-items: center; gap: 10px;
    background: none; border: 0; color: #eee; font: inherit; font-size: 13px;
    padding: 6px 10px; border-radius: 5px; text-align: left; cursor: default; }
  .mlist button:hover { background: #1a73e8; color: #fff; }
  .mlist button:hover kbd { color: #cfe0ff; }
  .mlist kbd { margin-left: auto; font: 11px ui-monospace, monospace; color: #9aa0a8; }
  .mlist hr { border: 0; border-top: 1px solid #454a52; margin: 5px 4px; }
  #status { margin-left: auto; color: #9fd49f; font-size: 12px; padding: 6px 4px; }

  /* ---- toolbar ---- */
  #toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    flex-wrap: wrap; }
  #toolbar .sep { width: 1px; height: 20px; background: #454a52; margin: 0 4px; }
  #toolbar button, #toolbar select, #toolbar input[type=number] {
    background: #3a3e45; color: #eee; border: 1px solid #4a4f57; border-radius: 6px;
    font: inherit; font-size: 13px; padding: 3px 9px; }
  #toolbar button:hover { background: #4a4f57; }
  #toolbar button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #toolbar button b, #toolbar button i, #toolbar button u { pointer-events: none; }
  #toolbar input[type=color] { width: 26px; height: 24px; padding: 1px;
    border: 1px solid #4a4f57; border-radius: 6px; background: #3a3e45; }
  #toolbar label { font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 5px; }
  #findbar, #linkbar, #commentbar, #tablebar, #borderbar { display: flex; align-items: center; gap: 4px; }
  #findbar[hidden], #linkbar[hidden], #commentbar[hidden], #tablebar[hidden], #borderbar[hidden] { display: none; }
  #findbar input, #linkbar input, #commentbar input, #tablebar input { background: #23262b;
    color: #eee; border: 1px solid #4a4f57; border-radius: 6px; font: inherit;
    font-size: 13px; padding: 3px 8px; }
  #findcount { font-size: 12px; color: #9aa0a8; }

  /* width:max-content + min-width:100%: pages wider than the viewport
     scroll horizontally instead of clipping their left edge (the flex
     centered-overflow trap); narrower content stays centered. */
  #pages { display: flex; flex-direction: column; align-items: center; gap: 24px;
    padding: 24px; width: max-content; min-width: 100%; box-sizing: border-box; }
  #pages svg { background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.45); height: auto; cursor: text; user-select: none; }
  #thumbs { flex: none; width: 132px; overflow-y: auto; background: #33363c;
    padding: 10px 8px; display: flex; flex-direction: column; gap: 8px;
    align-items: center; border-right: 1px solid #4a4f57; }
  #thumbs[hidden] { display: none; }
  #thumbs img { width: 108px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
    cursor: pointer; display: block; }
  #thumbs .cur { outline: 2px solid #1a73e8; }
  #thumbs .pageno { color: #aaa; font-size: 11px; margin: -4px 0 2px; }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Tools toggle: desktop always shows the toolbar, so the button hides. */
  #toolstoggle { display: none; background: none; border: 0; color: #ddd;
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
  #toolstoggle:hover, body.tools-open #toolstoggle { background: #3a3e45; color: #fff; }

  /* ---- narrow screens (mobile) ---- */
  @media (max-width: 640px) {
    #menubar { padding: 2px 6px 0; }
    #menubar .brand { margin: 0 6px 0 2px; }
    /* The toolbar eats three rows on a phone: collapsed by default,
       expanded with the Tools toggle in the menubar. */
    #toolstoggle { display: block; }
    #toolbar { display: none; }
    body.tools-open #toolbar { display: flex; padding: 4px 6px; gap: 4px; }
    #pages { padding: 10px 4px; gap: 12px; }
    /* Pages shrink to the screen; hit mapping goes through getScreenCTM,
       so CSS downscaling stays click-accurate. */
    #pages svg { max-width: 100%; }
    #status { flex-basis: 100%; order: 9; padding: 2px 4px 6px; }
  }
</style>
<header>
  <div id="menubar">
    <span class="brand">rdoc</span>
    <div class="menu">
      <button class="mtitle" data-i18n="menu.file"></button>
      <div class="mlist">
        <button id="demo" data-i18n="file.demo"></button>
        <button data-cmd="openFile" data-i18n="file.open"></button>
        <hr>
        <button data-cmd="sampleReport" data-i18n="file.sampleReport"></button>
        <button data-cmd="sampleTrack" data-i18n="file.sampleTrack"></button>
        <button data-cmd="sampleComment" data-i18n="file.sampleComment"></button>
        <button data-cmd="sampleFonts" data-i18n="file.sampleFonts"></button>
        <hr>
        <button id="save" data-i18n="file.save"></button>
        <button data-cmd="savePdf" data-i18n="file.savePdf"></button>
        <button data-cmd="docStats" data-i18n="file.stats"></button>
        <hr>
        <button data-cmd="paperA4" data-i18n="file.paperA4"></button>
        <button data-cmd="paperLetter" data-i18n="file.paperLetter"></button>
        <button data-cmd="paperLegal" data-i18n="file.paperLegal"></button>
        <hr>
        <button data-cmd="orientPortrait" data-i18n="file.portrait"></button>
        <button data-cmd="orientLandscape" data-i18n="file.landscape"></button>
        <hr>
        <button data-cmd="marginsNormal" data-i18n="file.marginsNormal"></button>
        <button data-cmd="marginsNarrow" data-i18n="file.marginsNarrow"></button>
        <button data-cmd="marginsWide" data-i18n="file.marginsWide"></button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle" data-i18n="menu.edit"></button>
      <div class="mlist">
        <button data-cmd="undo" data-i18n="edit.undo"><kbd>Ctrl+Z</kbd></button>
        <button data-cmd="redo" data-i18n="edit.redo"><kbd>Ctrl+Y</kbd></button>
        <hr>
        <button data-cmd="cut" data-i18n="edit.cut"><kbd>Ctrl+X</kbd></button>
        <button data-cmd="copy" data-i18n="edit.copy"><kbd>Ctrl+C</kbd></button>
        <button data-cmd="paste" data-i18n="edit.paste"><kbd>Ctrl+V</kbd></button>
        <button data-cmd="selectAll" data-i18n="edit.selectAll"><kbd>Ctrl+A</kbd></button>
        <hr>
        <button data-cmd="find" data-i18n="edit.find"><kbd>Ctrl+F</kbd></button>
        <button data-cmd="replace" data-i18n="edit.replace"><kbd>Ctrl+H</kbd></button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle" data-i18n="menu.insert"></button>
      <div class="mlist">
        <button data-cmd="insertImage" data-i18n="ins.image"></button>
        <button data-cmd="link" data-i18n="ins.link"><kbd>Ctrl+K</kbd></button>
        <button data-cmd="unlink" data-i18n="ins.unlink"></button>
        <hr>
        <button data-cmd="commentAdd" data-i18n="ins.commentAdd"></button>
        <button data-cmd="commentRemove" data-i18n="ins.commentRemove"></button>
        <button data-cmd="commentResolve" data-i18n="ins.commentResolve"></button>
        <hr>
        <button data-cmd="footnote" data-i18n="ins.footnote"><kbd>Ctrl+Alt+F</kbd></button>
        <button data-cmd="endnote" data-i18n="ins.endnote"><kbd>Ctrl+Alt+E</kbd></button>
        <button data-cmd="deleteNote" data-i18n="ins.deleteNote"><kbd>Ctrl+Alt+D</kbd></button>
        <hr>
        <button data-cmd="insertTable" data-i18n="ins.table"></button>
        <button data-cmd="rowAdd" data-i18n="ins.rowAdd"></button>
        <button data-cmd="rowDel" data-i18n="ins.rowDel"></button>
        <button data-cmd="colAdd" data-i18n="ins.colAdd"></button>
        <button data-cmd="colDel" data-i18n="ins.colDel"></button>
        <button data-cmd="mergeCells" data-i18n="ins.mergeCells"></button>
        <button data-cmd="splitCell" data-i18n="ins.splitCell"></button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle" data-i18n="menu.format"></button>
      <div class="mlist">
        <button data-cmd="bold" data-i18n="fmt.bold"><kbd>Ctrl+B</kbd></button>
        <button data-cmd="italic" data-i18n="fmt.italic"><kbd>Ctrl+I</kbd></button>
        <button data-cmd="underline" data-i18n="fmt.underline"><kbd>Ctrl+U</kbd></button>
        <hr>
        <button data-cmd="alignL" data-i18n="fmt.alignL"><kbd>Ctrl+L</kbd></button>
        <button data-cmd="alignC" data-i18n="fmt.alignC"><kbd>Ctrl+E</kbd></button>
        <button data-cmd="alignR" data-i18n="fmt.alignR"><kbd>Ctrl+R</kbd></button>
        <hr>
        <button data-cmd="listBullet" data-i18n="fmt.listBullet"></button>
        <button data-cmd="listNumber" data-i18n="fmt.listNumber"><kbd data-i18n="fmt.kbdLevel"></kbd></button>
        <hr>
        <button data-cmd="spacing1" data-i18n="fmt.spacing1"></button>
        <button data-cmd="spacing15" data-i18n="fmt.spacing15"></button>
        <button data-cmd="spacing2" data-i18n="fmt.spacing2"></button>
        <hr>
        <button data-cmd="tableBorders" data-i18n="fmt.tableBorders"></button>
      </div>
    </div>
    <div class="menu">
      <button class="mtitle" data-i18n="menu.view"></button>
      <div class="mlist">
        <button id="thumbtoggle" data-i18n="view.thumbs"></button>
        <button data-cmd="trackChanges" data-i18n="view.track"></button>
        <button data-cmd="acceptAll" data-i18n="view.acceptAll"></button>
        <button data-cmd="rejectAll" data-i18n="view.rejectAll"></button>
        <button data-cmd="comments" data-i18n="view.comments"></button>
      </div>
    </div>
    <button id="toolstoggle" data-i18n="tools.toggle" data-i18n-title="tools.toggleTitle"></button>
    <span id="status">loading wasm…</span>
  </div>
  <div id="toolbar">
    <span id="fmtbtns">
      <button data-fmt="b" data-i18n-title="tb.boldTitle"><b>B</b></button>
      <button data-fmt="i" data-i18n-title="tb.italicTitle"><i>I</i></button>
      <button data-fmt="u" data-i18n-title="tb.underlineTitle"><u>U</u></button>
    </span>
    <span id="alignbtns">
      <button data-align="l" data-i18n-title="tb.alignLTitle">⮜</button>
      <button data-align="c" data-i18n-title="tb.alignCTitle">⬌</button>
      <button data-align="r" data-i18n-title="tb.alignRTitle">⮞</button>
    </span>
    <span id="listbtns">
      <button data-list="bullet" data-i18n-title="tb.listBulletTitle">•¶</button>
      <button data-list="number" data-i18n-title="tb.listNumberTitle">1.</button>
    </span>
    <span class="sep"></span>
    <select id="fontfamily" data-i18n-title="tb.fontTitle">
      <!-- Font family names are document data, not UI copy: same in every locale. -->
      <option value="" selected disabled data-i18n="tb.fontPlaceholder"></option>
      <option value="Pretendard">Pretendard</option>
      <option value="맑은 고딕">맑은 고딕</option>
      <option value="나눔명조">나눔명조</option>
      <option value="굴림">굴림</option>
      <option value="돋움">돋움</option>
      <option value="바탕">바탕</option>
    </select>
    <label data-i18n="tb.sizeLabel" data-i18n-title="tb.sizeTitle">
      <input type="number" id="fontsize" min="6" max="96" step="1" style="width:3.4em" placeholder="pt">
    </label>
    <input type="color" id="fontcolor" value="#c00000" data-i18n-title="tb.colorTitle">
    <select id="linespacing" data-i18n-title="tb.spacingTitle">
      <option value="" selected disabled data-i18n="tb.spacingPlaceholder"></option>
      <option value="1">1.0</option>
      <option value="1.15">1.15</option>
      <option value="1.5">1.5</option>
      <option value="2">2.0</option>
    </select>
    <select id="parastyle" data-i18n-title="tb.styleTitle">
      <option value="" selected disabled data-i18n="tb.stylePlaceholder"></option>
      <option value="Normal" data-i18n="style.normal"></option>
      <option value="Heading1" data-i18n="style.h1"></option>
      <option value="Heading2" data-i18n="style.h2"></option>
      <option value="Heading3" data-i18n="style.h3"></option>
    </select>
    <span class="sep"></span>
    <span id="tblbtns" data-i18n-title="tb.tblTitle">
      <button data-op="r" data-i18n="tb.rowAdd" data-i18n-title="tb.rowAddTitle"></button>
      <button data-op="R" data-i18n="tb.rowDel" data-i18n-title="tb.rowDelTitle"></button>
      <button data-op="c" data-i18n="tb.colAdd" data-i18n-title="tb.colAddTitle"></button>
      <button data-op="C" data-i18n="tb.colDel" data-i18n-title="tb.colDelTitle"></button>
      <button id="mergebtn" data-i18n="tb.merge" data-i18n-title="tb.mergeTitle"></button>
      <button id="splitbtn" data-i18n="tb.split" data-i18n-title="tb.splitTitle"></button>
      <input type="color" id="cellshade" value="#FFF2CC" data-i18n-title="tb.shadeTitle">
    </span>
    <span class="sep"></span>
    <button id="imgbtn" data-i18n="tb.img" data-i18n-title="tb.imgTitle"></button>
    <input type="file" id="imgfile" accept="image/*" style="display:none">
    <input type="file" id="file" accept=".docx" style="display:none">
    <span class="sep"></span>
    <label>zoom <select id="zoom">
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select></label>
    <label data-i18n-title="tb.langLabel"><select id="lang">
      <!-- Language names stay in their own language, as everywhere else. -->
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select></label>
    <span id="linkbar" hidden>
      <span class="sep"></span>
      <input id="linkq" placeholder="https://…" autocomplete="off" size="24">
      <button id="linkapply" data-i18n="tb.linkApply" data-i18n-title="tb.linkApplyTitle"></button>
      <button id="linkremove" data-i18n="tb.linkRemove" data-i18n-title="tb.linkRemoveTitle"></button>
      <button id="linkclose" data-i18n-title="tb.close">✕</button>
    </span>
    <span id="tablebar" hidden>
      <span class="sep"></span>
      <label data-i18n="tb.rowsLabel"> <input type="number" id="tablerows" min="1" max="50" value="3" style="width:3em"></label>
      <label data-i18n="tb.colsLabel"> <input type="number" id="tablecols" min="1" max="20" value="3" style="width:3em"></label>
      <button id="tableapply" data-i18n="tb.tableApply" data-i18n-title="tb.tableApplyTitle"></button>
      <button id="tableclose" data-i18n-title="tb.close">✕</button>
    </span>
    <span id="borderbar" hidden>
      <span class="sep"></span>
      <select id="borderstyle">
        <option value="single" data-i18n="bd.single"></option>
        <option value="thick" data-i18n="bd.thick"></option>
        <option value="double" data-i18n="bd.double"></option>
        <option value="dotted" data-i18n="bd.dotted"></option>
        <option value="dashed" data-i18n="bd.dashed"></option>
        <option value="dotdash" data-i18n="bd.dotdash"></option>
        <option value="wave" data-i18n="bd.wave"></option>
        <option value="none" data-i18n="bd.none"></option>
      </select>
      <select id="borderwidth">
        <option value="0.25">0.25pt</option>
        <option value="0.5" selected>0.5pt</option>
        <option value="1">1pt</option>
        <option value="1.5">1.5pt</option>
        <option value="2.25">2.25pt</option>
        <option value="3">3pt</option>
      </select>
      <input type="color" id="bordercolor" value="#808080" data-i18n-title="tb.borderColorTitle">
      <button id="borderapply" data-i18n="tb.borderApply" data-i18n-title="tb.borderApplyTitle"></button>
      <button id="borderclose" data-i18n-title="tb.close">✕</button>
    </span>
    <span id="commentbar" hidden>
      <span class="sep"></span>
      <input id="commentq" data-i18n-ph="tb.commentPlaceholder" autocomplete="off" size="24">
      <button id="commentapply" data-i18n="tb.commentApply" data-i18n-title="tb.commentApplyTitle"></button>
      <button id="commentclose" data-i18n-title="tb.close">✕</button>
    </span>
    <span id="findbar" hidden>
      <span class="sep"></span>
      <input id="findq" data-i18n-ph="tb.findPlaceholder" autocomplete="off" size="14">
      <span id="findcount"></span>
      <button id="findprev" data-i18n-title="tb.findPrevTitle">▲</button>
      <button id="findnext" data-i18n-title="tb.findNextTitle">▼</button>
      <input id="replq" data-i18n-ph="tb.replPlaceholder" autocomplete="off" size="12">
      <button id="replone" data-i18n="tb.replOne" data-i18n-title="tb.replOneTitle"></button>
      <button id="replall" data-i18n="tb.replAll" data-i18n-title="tb.replAllTitle"></button>
      <button id="findclose" data-i18n-title="tb.close">✕</button>
    </span>
  </div>
</header>
<div id="app">
  <div id="thumbs" hidden></div>
  <div id="main"><div id="pages"></div></div>
</div>
<input id="ime" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="position:fixed; top:0; left:-9999px; width:100px; opacity:0">
<script type="module" src="./js/i18n/boot.js"></script>
<script type="module" src="./js/main.js"></script>
