<!doctype html>
<meta charset="utf-8">
<title>rdoc editor PoC (wasm)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #4a4f57; margin: 0; }
  header { background: #2b2e33; color: #eee; padding: 10px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  button, input[type=file], select { font: inherit; }
  #status { color: #9fd49f; font-size: 13px; }
  #hint { color: #aaa; font-size: 12px; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px; }
  #pages svg { background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.45); height: auto; cursor: text; user-select: none; }
  #thumbs { position: fixed; left: 0; top: 64px; bottom: 0; width: 132px;
    overflow-y: auto; background: #33363c; padding: 10px 8px; z-index: 1;
    display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #thumbs img { width: 108px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
    cursor: pointer; display: block; }
  #thumbs .cur { outline: 2px solid #1a73e8; }
  #thumbs .pageno { color: #aaa; font-size: 11px; margin: -4px 0 2px; }
  body.thumbs-open #pages { margin-left: 132px; }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<header>
  <h1>rdoc editor PoC</h1>
  <button id="demo">Load demo</button>
  <label><input type="file" id="file" accept=".docx"></label>
  <button id="save">Save .docx</button>
  <button id="thumbtoggle" title="페이지 목록">🗂</button>
  <label>zoom <select id="zoom">
    <option value="0.75">75%</option>
    <option value="1" selected>100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select></label>
  <label title="글자 크기 (pt)">크기
    <input type="number" id="fontsize" min="6" max="96" step="1" style="width:3.2em" placeholder="pt">
  </label>
  <span id="alignbtns">
    <button data-align="l" title="왼쪽 정렬 (Ctrl+L)">⮜</button>
    <button data-align="c" title="가운데 정렬 (Ctrl+E)">⬌</button>
    <button data-align="r" title="오른쪽 정렬 (Ctrl+R)">⮞</button>
  </span>
  <span id="tblbtns" title="표: 캐럿 셀 기준">
    <button data-op="r" title="아래에 행 추가">행+</button>
    <button data-op="R" title="행 삭제">행−</button>
    <button data-op="c" title="오른쪽에 열 추가">열+</button>
    <button data-op="C" title="열 삭제">열−</button>
  </span>
  <span id="findbar" hidden>
    <input id="findq" placeholder="찾기" autocomplete="off" size="14">
    <span id="findcount"></span>
    <button id="findprev" title="이전 (Shift+Enter)">▲</button>
    <button id="findnext" title="다음 (Enter)">▼</button>
    <input id="replq" placeholder="바꾸기" autocomplete="off" size="12">
    <button id="replone" title="현재 매치 바꾸기">바꾸기</button>
    <button id="replall" title="모두 바꾸기">모두</button>
    <button id="findclose" title="닫기 (Esc)">✕</button>
  </span>
  <span id="status">loading wasm…</span>
  <span id="hint">click: caret · drag: select · type/Enter/Backspace/화살표 · Ctrl+B/I/U · Ctrl+L/E/R 정렬 · Ctrl+Z/Y · Ctrl+C/X/V · Ctrl+F 찾기/H 바꾸기 · Ctrl+Alt+F 각주/E 미주/D 삭제 · 한글 IME</span>
</header>
<div id="thumbs" hidden></div>
<div id="pages"></div>
<input id="ime" autocomplete="off" style="position:fixed; top:0; left:-9999px; width:100px; opacity:0">
<script type="module">
  import init, { SvgConverter } from "./pkg/rdocx_svg_poc.js";

  const statusEl = document.getElementById("status");
  const pagesEl = document.getElementById("pages");
  const status = (m) => statusEl.textContent = m;

  await init();
  const conv = new SvgConverter();
  try {
    const buf = await (await fetch("./malgun.ttf")).arrayBuffer();
    conv.add_font("Malgun Gothic", new Uint8Array(buf));
  } catch (e) { /* Korean falls back to bundled fonts */ }
  status("ready — load the demo or open a .docx");

  // ---- state ---------------------------------------------------------------

  let pageHits = [];        // pageHits[pageIndex] = [HitRun...] (ids page-local)
  let caret = null;         // {path, off} in document coordinates
  let sel = null;           // {a, b} where each is {page, idx, k}; a <= b
  let lastMs = 0;
  let lastDelta = "";
  let zoom = 1;

  const chars = (s) => [...s];
  const width = (h) => h.adv.reduce((a, b) => a + b, 0);
  const cum = (h, k) => h.adv.slice(0, k).reduce((a, b) => a + b, 0);
  const allHits = () => pageHits.flat();
  const getRun = (ref) => (pageHits[ref.page - 1] || [])[ref.idx];
  const cmpPos = (p, q) => (p.page - q.page) || (p.idx - q.idx) || ((p.k ?? 0) - (q.k ?? 0));

  function applyZoom() {
    for (const svg of pagesEl.children) {
      svg.style.width = (svg.viewBox.baseVal.width * zoom * (700 / 612)) + "px";
    }
  }
  document.getElementById("zoom").onchange = (e) => { zoom = +e.target.value; applyZoom(); };

  // Changed pages are applied lazily: pages in (or near) the viewport get
  // their SVG now; the rest go into a dirty set drained on idle time.
  // page_svg always renders the *current* document, so a page that turns
  // dirty across several edits is still correct when finally drained.
  const dirtyPages = new Set();
  let drainScheduled = false;

  function applyPage(i) {
    const svg = conv.page_svg(i);
    const cur = pagesEl.children[i];
    if (cur) cur.outerHTML = svg;
    else pagesEl.insertAdjacentHTML("beforeend", svg);
    if (thumbsOpen()) { thumbDirty.add(i); scheduleThumbs(); }
  }

  function pageNearViewport(i) {
    const el = pagesEl.children[i];
    if (!el) return true; // not in the DOM yet: apply now to keep indices aligned
    const r = el.getBoundingClientRect();
    return r.bottom > -innerHeight && r.top < 2 * innerHeight; // ±1 viewport
  }

  function drainDirty() {
    drainScheduled = false;
    const t0 = performance.now();
    for (const i of [...dirtyPages].sort((a, b) => a - b)) {
      applyPage(i);
      dirtyPages.delete(i);
      if (performance.now() - t0 > 8) break; // keep the tab responsive
    }
    if (dirtyPages.size) scheduleDrain();
    else { applyZoom(); drawFindHl(); report(); }
  }

  function scheduleDrain() {
    if (drainScheduled) return;
    drainScheduled = true;
    (window.requestIdleCallback || ((f) => setTimeout(f, 30)))(drainDirty);
  }

  // ---- page thumbnails -----------------------------------------------------
  // Sidebar minis are blob images of the page SVG strings already in the
  // DOM, so no extra wasm rendering happens; changed pages re-blob on idle.
  const thumbsEl = document.getElementById("thumbs");
  const thumbDirty = new Set();
  let thumbTimer = null;

  function thumbsOpen() { return !thumbsEl.hidden; }

  function refreshThumb(i) {
    const page = pagesEl.children[i];
    const img = thumbsEl.children[i] && thumbsEl.children[i].querySelector("img");
    if (!page || !img) return;
    const url = URL.createObjectURL(new Blob([page.outerHTML], { type: "image/svg+xml" }));
    const old = img.src;
    img.src = url;
    if (old) URL.revokeObjectURL(old);
  }

  function syncThumbCount() {
    const n = pagesEl.children.length;
    while (thumbsEl.children.length > n) thumbsEl.lastChild.remove();
    while (thumbsEl.children.length < n) {
      const i = thumbsEl.children.length;
      const cell = document.createElement("div");
      const img = document.createElement("img");
      img.onclick = () => pagesEl.children[i] && pagesEl.children[i].scrollIntoView({ block: "start" });
      const no = document.createElement("div");
      no.className = "pageno";
      no.textContent = i + 1;
      cell.appendChild(img);
      cell.appendChild(no);
      thumbsEl.appendChild(cell);
      thumbDirty.add(i);
    }
  }

  function scheduleThumbs() {
    if (!thumbsOpen() || thumbTimer) return;
    thumbTimer = setTimeout(() => {
      thumbTimer = null;
      const t0 = performance.now();
      for (const i of [...thumbDirty].sort((a, b) => a - b)) {
        // A page still deferred in dirtyPages would blob stale content —
        // let the drain finish first and keep the thumb queued.
        if (dirtyPages.has(i)) continue;
        refreshThumb(i);
        thumbDirty.delete(i);
        if (performance.now() - t0 > 12) break;
      }
      if (thumbDirty.size) scheduleThumbs();
    }, 60);
  }

  document.getElementById("thumbtoggle").onclick = () => {
    thumbsEl.hidden = !thumbsEl.hidden;
    document.body.classList.toggle("thumbs-open", !thumbsEl.hidden);
    if (thumbsOpen()) {
      syncThumbCount();
      for (let i = 0; i < pagesEl.children.length; i++) thumbDirty.add(i);
      scheduleThumbs();
    }
  };

  // Scrolling toward a deferred page must never show stale content: drain
  // anything near the viewport immediately.
  window.addEventListener("scroll", () => {
    if (!dirtyPages.size) return;
    let drained = false;
    for (const i of [...dirtyPages]) {
      if (pageNearViewport(i)) { applyPage(i); dirtyPages.delete(i); drained = true; }
    }
    if (drained) applyZoom();
  }, { passive: true });

  function apply(json, ms) {
    const out = JSON.parse(json);
    while (pagesEl.children.length > out.total) pagesEl.lastChild.remove();
    for (const i of dirtyPages) if (i >= out.total) dirtyPages.delete(i);
    let drawnNow = 0;
    for (const i of out.changed) {
      if (pageNearViewport(i)) { applyPage(i); drawnNow++; dirtyPages.delete(i); }
      else dirtyPages.add(i);
    }
    if (dirtyPages.size) scheduleDrain();
    if (thumbsOpen()) { syncThumbCount(); scheduleThumbs(); }
    for (const [i, runs] of out.hits) pageHits[i] = runs;
    pageHits.length = out.total;
    lastMs = ms;
    lastDelta = `${drawnNow}/${out.total} pages redrawn` +
                (dirtyPages.size ? `, ${dirtyPages.size} deferred` : "");
    sel = null;
    applyZoom();
    drawCaret();
    drawSelection();
    drawPreedit();
    if (!findbar.hidden) runFind(true);
    report();
  }

  function report(extra) {
    const c = caret ? `caret: ${caret.path}, offset ${caret.off}` : (sel ? "selection" : "no caret");
    status(`${c} | last op ${lastMs.toFixed(1)} ms (${lastDelta})${extra ? " | " + extra : ""}`);
  }

  // ---- hit testing ---------------------------------------------------------

  function findHit(page, x, y) {
    let best = null, bestScore = Infinity;
    for (const h of pageHits[page - 1] || []) {
      // Zero-advance hits are empty paragraphs: clickable, but real text
      // runs win when both are near (their spans cover actual distance).
      const dy = y < h.y - h.size ? (h.y - h.size) - y : (y > h.y + 0.3 * h.size ? y - (h.y + 0.3 * h.size) : 0);
      const x1 = h.x, x2 = h.x + width(h);
      const dx = x < x1 ? x1 - x : (x > x2 ? x - x2 : 0);
      const score = dy * 3 + dx;
      if (score < bestScore) { bestScore = score; best = h; }
    }
    if (!best) return null;
    let k = 0, cx = best.x;
    for (const a of best.adv) { if (x < cx + a / 2) break; cx += a; k++; }
    return { hit: best, k };
  }

  function visFor(pos) {
    if (!pos) return null;
    let best = null;
    for (const h of allHits()) {
      if (h.path !== pos.path || h.start === null) continue;
      const len = chars(h.text).length;
      if (pos.off >= h.start && pos.off <= h.start + len) {
        best = { hit: h, k: pos.off - h.start };
        if (pos.off < h.start + len) break;
      }
    }
    return best;
  }

  const caretVis = () => visFor(caret);

  function drawCaret() {
    document.querySelectorAll(".caret").forEach((n) => n.remove());
    const vis = caretVis();
    if (!vis) return;
    queueMicrotask(() => {
      // scrollIntoView is unreliable on SVG children; scroll explicitly.
      const el = document.querySelector(".caret");
      if (!el) return;
      const r = el.getBoundingClientRect();
      const headerH = 70;
      if (r.top < headerH || r.bottom > window.innerHeight - 10) {
        window.scrollBy({ top: r.top - window.innerHeight / 2, behavior: "instant" });
      }
    });
    const { hit: h, k } = vis;
    const svg = pagesEl.children[h.page - 1];
    if (!svg) return;
    const x = h.x + cum(h, k);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x); line.setAttribute("x2", x);
    line.setAttribute("y1", h.y - 0.85 * h.size);
    line.setAttribute("y2", h.y + 0.25 * h.size);
    line.setAttribute("stroke", "#1a73e8");
    line.setAttribute("stroke-width", "0.8");
    line.setAttribute("class", "caret");
    svg.appendChild(line);
  }

  // ---- selection -----------------------------------------------------------

  function orderSel(p, q) {
    return cmpPos(p, q) <= 0 ? { a: p, b: q } : { a: q, b: p };
  }

  function drawSelection() {
    document.querySelectorAll(".selrect").forEach((n) => n.remove());
    if (!sel) return;
    for (const h of allHits()) {
      const ref = { page: h.page, idx: h.id };
      if (cmpPos({ ...ref, k: h.adv.length }, sel.a) < 0 || cmpPos({ ...ref, k: 0 }, sel.b) > 0) continue;
      const sameA = h.page === sel.a.page && h.id === sel.a.idx;
      const sameB = h.page === sel.b.page && h.id === sel.b.idx;
      const k1 = sameA ? sel.a.k : 0;
      const k2 = sameB ? sel.b.k : h.adv.length;
      if (k2 <= k1) continue;
      const svg = pagesEl.children[h.page - 1];
      if (!svg) continue;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", h.x + cum(h, k1));
      r.setAttribute("y", h.y - 0.85 * h.size);
      r.setAttribute("width", cum(h, k2) - cum(h, k1));
      r.setAttribute("height", 1.1 * h.size);
      r.setAttribute("fill", "#1a73e8");
      r.setAttribute("opacity", "0.28");
      r.setAttribute("class", "selrect");
      svg.appendChild(r);
    }
  }

  // ---- paste (Ctrl+V) ------------------------------------------------------
  // Plain text only. Multi-line text becomes paragraph splits (one history
  // entry via wasm paste_text). A selection is replaced first: single-line
  // pastes ride the atomic replace path; multi-line over a selection is
  // delete + paste (two history entries — a recorded limitation).
  function doPaste(text) {
    if (!text) return;
    const lines = text.replace(/\r\n?/g, "\n").split("\n");
    if (sel && lines.length === 1) { replaceSelWith(text); return; }
    if (sel) deleteSel();
    if (!caret) return;
    const at = { ...caret };
    edit(() => {
      const json = conv.paste_text(at.path, at.off, text);
      caret = lines.length === 1
        ? { path: at.path, off: at.off + chars(text).length }
        : { path: siblingPath(at.path, lines.length - 1), off: chars(lines[lines.length - 1]).length };
      sel = null;
      return json;
    });
  }

  document.addEventListener("paste", (e) => {
    if (e.target === findq || e.target === replq) return;
    const text = e.clipboardData && e.clipboardData.getData("text/plain");
    if (text == null) return;
    e.preventDefault();
    doPaste(text);
  });

  // ---- find (Ctrl+F) -------------------------------------------------------
  // Paragraph-scoped, case-insensitive search over every rendered story.
  // The current match becomes the live selection (typing replaces it, copy
  // works); other matches get a light overlay redrawn after edits/drains.
  const findbar = document.getElementById("findbar");
  const findq = document.getElementById("findq");
  const findcount = document.getElementById("findcount");
  const FIND_HL_CAP = 500; // overlay rects only; count/cycling stay exact
  let findMatches = [];    // {path, start, end} in document order
  let findCur = -1;

  function findParaOrder() {
    const seen = new Set(), out = [];
    for (const h of allHits())
      if (h.path !== null && !seen.has(h.path)) { seen.add(h.path); out.push(h.path); }
    return out;
  }

  function runFind(keepCur) {
    const q = findq.value;
    const prev = keepCur && findCur >= 0 ? findMatches[findCur] : null;
    findMatches = [];
    if (q) {
      const ql = q.toLowerCase();
      const qlen = chars(q).length;
      for (const path of findParaOrder()) {
        const text = conv.paragraph_text_at(path);
        if (text == null) continue;
        const low = text.toLowerCase();
        let idx = low.indexOf(ql);
        while (idx !== -1) {
          const start = chars(text.slice(0, idx)).length;
          findMatches.push({ path, start, end: start + qlen });
          idx = low.indexOf(ql, idx + ql.length); // non-overlapping, like Word
        }
      }
    }
    findCur = prev
      ? findMatches.findIndex((m) => m.path === prev.path && m.start === prev.start)
      : -1;
    findcount.textContent = q ? `${findCur + 1 || "–"}/${findMatches.length}` : "";
    drawFindHl();
  }

  function drawFindHl() {
    document.querySelectorAll(".findhl").forEach((n) => n.remove());
    if (findbar.hidden || !findMatches.length) return;
    const byPath = new Map();
    for (const h of allHits()) {
      if (h.path === null || h.start === null) continue;
      let a = byPath.get(h.path);
      if (!a) { a = []; byPath.set(h.path, a); }
      a.push(h);
    }
    for (let m = 0; m < Math.min(findMatches.length, FIND_HL_CAP); m++) {
      if (m === findCur) continue; // the current match is the live selection
      const { path, start, end } = findMatches[m];
      for (const h of byPath.get(path) || []) {
        const k1 = Math.max(start, h.start) - h.start;
        const k2 = Math.min(end, h.start + h.adv.length) - h.start;
        if (k2 <= k1) continue;
        const svg = pagesEl.children[h.page - 1];
        if (!svg) continue;
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", h.x + cum(h, k1));
        r.setAttribute("y", h.y - 0.85 * h.size);
        r.setAttribute("width", cum(h, k2) - cum(h, k1));
        r.setAttribute("height", 1.1 * h.size);
        r.setAttribute("fill", "#f9ab00");
        r.setAttribute("opacity", "0.35");
        r.setAttribute("class", "findhl");
        svg.appendChild(r);
      }
    }
  }

  function gotoFind(dir) {
    if (!findMatches.length) return;
    findCur = ((findCur + dir) % findMatches.length + findMatches.length) % findMatches.length;
    const m = findMatches[findCur];
    const a = refForOffset(m.path, m.start, false), b = refForOffset(m.path, m.end, true);
    if (a && b) {
      sel = orderSel(a, b);
      caret = null;
      selAnchor = null;
      selFocus = null;
      drawCaret();
      drawSelection();
    }
    findcount.textContent = `${findCur + 1}/${findMatches.length}`;
    drawFindHl();
    const r0 = document.querySelector(".selrect");
    if (r0) {
      const rc = r0.getBoundingClientRect();
      if (rc.top < 0 || rc.bottom > innerHeight)
        window.scrollBy({ top: rc.top - innerHeight / 2 });
    }
    report(`찾기 ${findCur + 1}/${findMatches.length}`);
  }

  function openFind() {
    findbar.hidden = false;
    findq.focus();
    findq.select();
    runFind(true);
  }

  function closeFind() {
    findbar.hidden = true;
    findMatches = [];
    findCur = -1;
    findcount.textContent = "";
    drawFindHl();
    ime.focus({ preventScroll: true });
  }

  findq.addEventListener("input", () => {
    clearTimeout(findq._t);
    findq._t = setTimeout(() => runFind(false), 150);
  });
  findq.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      clearTimeout(findq._t);
      runFind(true);
      gotoFind(e.shiftKey ? -1 : 1);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeFind();
    }
    e.stopPropagation();
  });
  document.getElementById("findprev").onclick = () => gotoFind(-1);
  document.getElementById("findnext").onclick = () => gotoFind(1);
  document.getElementById("findclose").onclick = closeFind;

  const replq = document.getElementById("replq");
  replq.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); replaceCurrent(); }
    else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
    e.stopPropagation();
  });

  // Replace the current match, then advance to the next match at or after
  // the replacement site (apply() reruns the search, so indices are fresh).
  function replaceCurrent() {
    if (findCur < 0) { gotoFind(1); return; }
    const m = findMatches[findCur];
    const order = findParaOrder();
    const before = { para: order.indexOf(m.path), start: m.start };
    replaceSelWith(replq.value); // one history entry; apply() reran the find
    if (!findMatches.length) return;
    let next = findMatches.findIndex((c) => {
      const pi = order.indexOf(c.path);
      return pi > before.para || (pi === before.para && c.start >= before.start);
    });
    if (next === -1) next = 0;
    findCur = next - 1; // so gotoFind(+1) lands exactly on `next`
    gotoFind(1);
  }

  // Replace every match as one history entry (single undo).
  function replaceAll() {
    if (!findMatches.length) return;
    const n = findMatches.length;
    edit(() => {
      const json = conv.replace_all(JSON.stringify(findMatches), replq.value);
      caret = null;
      sel = null;
      return json;
    });
    report(`모두 바꾸기: ${n}건`);
  }

  document.getElementById("replone").onclick = replaceCurrent;
  document.getElementById("replall").onclick = replaceAll;

  // Underline the in-flight IME preedit, the visual convention for "not
  // committed yet". Overlay-only: the document never carries the underline,
  // so commit/cancel/undo need no formatting cleanup.
  function drawPreedit() {
    document.querySelectorAll(".preedit").forEach((n) => n.remove());
    if (!comp || comp.len === 0 || !caret) return;
    const from = comp.base, to = comp.base + comp.len;
    for (const h of allHits()) {
      if (h.path !== caret.path || h.start === null) continue;
      const len = chars(h.text).length;
      const k1 = Math.max(0, from - h.start);
      const k2 = Math.min(len, to - h.start);
      if (k2 <= k1) continue;
      const svg = pagesEl.children[h.page - 1];
      if (!svg) continue;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      const y = h.y + 0.16 * h.size;
      line.setAttribute("x1", h.x + cum(h, k1));
      line.setAttribute("x2", h.x + cum(h, k2));
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("stroke", "#1a73e8");
      line.setAttribute("stroke-width", 0.07 * h.size);
      line.setAttribute("class", "preedit");
      svg.appendChild(line);
    }
  }

  function selectedText() {
    if (!sel) return "";
    let out = "", prev = null;
    for (const h of allHits()) {
      // Decorative runs (note markers, list bullets, generated page
      // numbers) have no source path; Word does not copy them as text.
      if (h.path === null) continue;
      const ref = { page: h.page, idx: h.id };
      const cs = chars(h.text);
      if (cmpPos({ ...ref, k: cs.length }, sel.a) < 0 || cmpPos({ ...ref, k: 0 }, sel.b) > 0) continue;
      const sameA = h.page === sel.a.page && h.id === sel.a.idx;
      const sameB = h.page === sel.b.page && h.id === sel.b.idx;
      const k1 = sameA ? sel.a.k : 0;
      const k2 = sameB ? sel.b.k : cs.length;
      if (k2 <= k1) continue;
      if (prev && prev.path !== h.path) out += "\n";
      out += cs.slice(k1, k2).join("");
      prev = h;
    }
    return out;
  }

  let lastCopied = "";
  async function copySelection() {
    const text = selectedText();
    if (!text) return;
    lastCopied = text;
    try { await navigator.clipboard.writeText(text); } catch (e) { /* headless */ }
    report(`copied ${chars(text).length} chars`);
  }

  // Paragraph alignment for the caret paragraph or every paragraph the
  // selection touches, as one history entry. Text is unchanged, so the
  // caret survives; the selection is redrawn from its refs afterwards.
  function alignSelection(align) {
    let paths = [];
    const r = selRange();
    if (r && r.kind === "scatter") paths = [...new Set(r.ranges.map((x) => x.path))];
    else if (r && r.kind === "siblings") {
      const idx = (pp) => +pp.match(/(\d+)$/)[1];
      for (let i = idx(r.pa); i <= idx(r.pb); i++)
        paths.push(r.pa.replace(/\d+$/, i));
    } else if (r) paths = [r.pa];
    else if (caret) paths = [caret.path];
    if (!paths.length) { report("정렬: 캐럿을 두거나 선택하세요"); return; }
    const keep = caret && { ...caret };
    const keepSel = sel && { a: { ...sel.a }, b: { ...sel.b } };
    edit(() => {
      const json = conv.set_alignment_paths(JSON.stringify(paths), align);
      caret = keep;
      return json;
    });
    if (keepSel) { sel = keepSel; drawSelection(); }
  }
  document.querySelectorAll("#alignbtns button").forEach((b) => {
    b.onclick = () => alignSelection(b.dataset.align);
  });

  // Any selection as per-paragraph {path, start, end} ranges.
  function selectionRanges() {
    const r = selRange();
    if (!r) return null;
    if (r.kind === "scatter") return r.ranges;
    if (r.kind === "same") return [{ path: r.pa, start: r.oa, end: r.ob }];
    const idx = (pp) => +pp.match(/(\d+)$/)[1];
    const out = [];
    for (let i = idx(r.pa); i <= idx(r.pb); i++) {
      const path = r.pa.replace(/\d+$/, i);
      const len = chars(conv.paragraph_text_at(path) || "").length;
      const start = i === idx(r.pa) ? r.oa : 0;
      const end = i === idx(r.pb) ? r.ob : len;
      if (end > start) out.push({ path, start, end });
    }
    return out;
  }

  // Font size over the selection. Sizes reflow lines, so the selection's
  // page refs go stale — collapse to a caret at the range start instead.
  function applyFontSize(pt) {
    if (!(pt >= 6 && pt <= 96)) return;
    const ranges = selectionRanges();
    if (!ranges || !ranges.length) { report("크기: 텍스트를 선택하세요"); return; }
    edit(() => {
      const json = conv.set_size_ranges(JSON.stringify(ranges), pt);
      caret = { path: ranges[0].path, off: ranges[0].start };
      sel = null;
      return json;
    });
  }
  const fontsizeEl = document.getElementById("fontsize");
  fontsizeEl.addEventListener("change", () => {
    applyFontSize(+fontsizeEl.value);
    fontsizeEl.blur();
  });
  fontsizeEl.addEventListener("keydown", (e) => e.stopPropagation());

  // Table structure ops act on the caret's cell (top-level tables).
  function tableOp(op) {
    if (!caret || !/^d\/\d+\.\d+\.\d+\.\d+$/.test(caret.path)) {
      report("표 셀에 캐럿을 두세요");
      return;
    }
    const keep = { ...caret };
    edit(() => {
      const json = conv.table_op(keep.path, op);
      caret = op === "R" || op === "C" ? null : keep;
      sel = null;
      return json;
    });
  }
  document.querySelectorAll("#tblbtns button").forEach((b) => {
    b.onclick = () => tableOp(b.dataset.op);
  });

  // Cut = copy, then the ordinary selection deletion (one history entry).
  function cutSelection() {
    if (!sel) return;
    copySelection();
    deleteSel();
  }

  // ---- mouse ---------------------------------------------------------------

  function svgPoint(svg, clientX, clientY) {
    return new DOMPoint(clientX, clientY).matrixTransform(svg.getScreenCTM().inverse());
  }

  let mouse = null;
  // Keyboard selection: fixed anchor and moving focus, in document coords.
  let selAnchor = null;
  let selFocus = null;

  function refAt(pos) {
    const vis = visFor(pos);
    if (!vis) return null;
    return { page: vis.hit.page, idx: vis.hit.id, k: vis.k };
  }

  function extendSelection(key) {
    // Establish anchor and focus from the caret or an existing selection.
    if (!selAnchor) {
      if (caret) {
        selAnchor = { ...caret };
        selFocus = { ...caret };
      } else if (sel) {
        const A = getRun(sel.a), B = getRun(sel.b);
        if (!A || !B || A.path === null || B.path === null) return;
        selAnchor = { path: A.path, off: A.start + sel.a.k };
        selFocus = { path: B.path, off: B.start + sel.b.k };
      } else return;
    }
    if (key === "ArrowLeft") selFocus = { ...selFocus, off: Math.max(0, selFocus.off - 1) };
    else if (key === "ArrowRight") {
      const len = chars(conv.paragraph_text_at(selFocus.path) || "").length;
      selFocus = { ...selFocus, off: Math.min(len, selFocus.off + 1) };
    } else if (key === "Home" || key === "End") {
      const off = lineEdgeOff(selFocus, key === "End");
      if (off !== null) selFocus = { ...selFocus, off };
    } else {
      const t = lineTarget(selFocus, key === "ArrowDown" ? +1 : -1);
      if (t) selFocus = t;
    }
    if (selAnchor.path === selFocus.path && selAnchor.off === selFocus.off) {
      sel = null;
      caret = { ...selFocus };
    } else {
      const a = refAt(selAnchor), b = refAt(selFocus);
      if (!a || !b) return;
      sel = orderSel(a, b);
      caret = null;
    }
    drawCaret();
    drawSelection();
    report();
  }

  // A non-shift arrow collapses an active selection to one of its edges.
  function collapseSelection(toEnd) {
    const ref = toEnd ? sel.b : sel.a;
    const run = getRun(ref);
    sel = null;
    selAnchor = null;
    selFocus = null;
    if (run && run.path !== null) caret = { path: run.path, off: run.start + ref.k };
    drawCaret();
    drawSelection();
    report();
  }
  pagesEl.addEventListener("mousedown", (e) => {
    const svg = e.target.closest("svg");
    if (!svg) return;
    finalizeComposition();
    const page = [...pagesEl.children].indexOf(svg) + 1;
    const pt = svgPoint(svg, e.clientX, e.clientY);
    const found = findHit(page, pt.x, pt.y);
    if (e.detail >= 3 && found && found.hit.path !== null && found.hit.start !== null) {
      // Triple-click: select the whole paragraph under the cursor.
      const path = found.hit.path;
      const len = chars(conv.paragraph_text_at(path) || "").length;
      if (selectParaOffsets(path, 0, len)) report(`paragraph: ${path}`);
      mouse = { svg, page, start: { x: e.clientX, y: e.clientY }, anchor: null, dragged: false, tripled: true };
      return;
    }
    mouse = {
      svg, page,
      start: { x: e.clientX, y: e.clientY },
      anchor: found ? { page: found.hit.page, idx: found.hit.id, k: found.k } : null,
      dragged: false,
    };
  });
  function extendDragTo(clientX, clientY) {
    const el = document.elementFromPoint(clientX, clientY);
    const svg = (el && el.closest("svg")) || mouse.svg;
    const page = [...pagesEl.children].indexOf(svg) + 1;
    const pt = svgPoint(svg, clientX, clientY);
    const found = findHit(page, pt.x, pt.y);
    if (!found) return;
    sel = orderSel(mouse.anchor, { page: found.hit.page, idx: found.hit.id, k: found.k });
    caret = null;
    drawCaret();
    drawSelection();
    report();
  }

  const SCROLL_EDGE = 28; // px from the viewport edge that triggers scrolling
  function dragAutoScroll() {
    if (!mouse || !mouse.dragged) { mouse && (mouse.raf = null); return; }
    const y = mouse.lastY;
    const dy = y < SCROLL_EDGE ? y - SCROLL_EDGE
             : y > innerHeight - SCROLL_EDGE ? y - (innerHeight - SCROLL_EDGE) : 0;
    if (dy) {
      window.scrollBy(0, dy * 0.4);
      extendDragTo(mouse.lastX, mouse.lastY);
    }
    mouse.raf = requestAnimationFrame(dragAutoScroll);
  }

  pagesEl.addEventListener("mousemove", (e) => {
    if (!mouse || !mouse.anchor) return;
    if (!mouse.dragged && Math.hypot(e.clientX - mouse.start.x, e.clientY - mouse.start.y) < 4) return;
    mouse.dragged = true;
    mouse.lastX = e.clientX;
    mouse.lastY = e.clientY;
    if (!mouse.raf) mouse.raf = requestAnimationFrame(dragAutoScroll);
    extendDragTo(e.clientX, e.clientY);
  });
  pagesEl.addEventListener("dblclick", (e) => {
    const svg = e.target.closest("svg");
    if (!svg) return;
    const page = [...pagesEl.children].indexOf(svg) + 1;
    const pt = svgPoint(svg, e.clientX, e.clientY);
    const found = findHit(page, pt.x, pt.y);
    if (!found || found.hit.path === null || found.hit.start === null) return;
    const h = found.hit;
    const text = conv.paragraph_text_at(h.path) || "";
    const cs = chars(text);
    let off = Math.min(h.start + found.k, cs.length);
    if (off >= cs.length) off = cs.length - 1;
    if (off < 0) return;
    const isWord = (ch) => ch && !/\s/.test(ch);
    if (!isWord(cs[off])) return;
    let lo = off, hi = off + 1;
    while (lo > 0 && isWord(cs[lo - 1])) lo--;
    while (hi < cs.length && isWord(cs[hi])) hi++;
    if (selectParaOffsets(h.path, lo, hi))
      report(`word: ${JSON.stringify(cs.slice(lo, hi).join(""))}`);
  });

  // Hit-ref for a character offset of one paragraph, on any of its lines.
  function refForOffset(path, offset, wantEnd) {
    for (const cand of allHits()) {
      if (cand.path !== path || cand.start === null) continue;
      const lo = cand.start, hi = cand.start + chars(cand.text).length;
      if (offset >= lo && (offset < hi || (wantEnd && offset <= hi)))
        return { page: cand.page, idx: cand.id, k: offset - lo };
    }
    return null;
  }

  function selectParaOffsets(path, lo, hi) {
    const a = refForOffset(path, lo, false), b = refForOffset(path, hi, true);
    if (!a || !b) return false;
    sel = orderSel(a, b);
    caret = null;
    drawCaret(); drawSelection();
    return true;
  }

  window.addEventListener("mouseup", (e) => {
    if (!mouse) return;
    if (mouse.raf) cancelAnimationFrame(mouse.raf);
    if (mouse.tripled) { mouse = null; return; }
    if (!mouse.dragged) {
      const pt = svgPoint(mouse.svg, e.clientX, e.clientY);
      if (e.shiftKey && (caret || selAnchor)) {
        const found = findHit(mouse.page, pt.x, pt.y);
        if (found && found.hit.path !== null && found.hit.start !== null) {
          if (!selAnchor) selAnchor = { ...caret };
          selFocus = { path: found.hit.path, off: found.hit.start + found.k };
          const a = refAt(selAnchor), b = refAt(selFocus);
          if (a && b) {
            sel = orderSel(a, b);
            caret = null;
            drawCaret();
            drawSelection();
            report();
            mouse = null;
            return;
          }
        }
      }
      clickAt(mouse.page, pt.x, pt.y);
    }
    mouse = null;
  });

  function clickAt(page, x, y) {
    finalizeComposition();
    selAnchor = null;
    selFocus = null;
    sel = null;
    drawSelection();
    const found = findHit(page, x, y);
    if (!found) return;
    const { hit: h, k } = found;
    if (h.path === null) {
      caret = null;
      drawCaret();
      report(`segment ${JSON.stringify(h.text)} is decorative (marker/field) — not editable`);
      return;
    }

    caret = { path: h.path, off: h.start + k };
    drawCaret();
    report();
    ime.focus({ preventScroll: true });
  }

  // ---- editing -------------------------------------------------------------

  /// Selection endpoints as an ordered document range, or null when either
  /// endpoint has no provenance mapping.
  // Sibling paragraphs = same path with only the final numeric segment
  // differing (same body run, same cell, same header/footer, same note).
  function sameContainer(pa, pb) {
    const a = pa.match(/^(.*?)(\d+)$/), b = pb.match(/^(.*?)(\d+)$/);
    return !!(a && b && a[1] === b[1]);
  }

  function selRange() {
    if (!sel) return null;
    const A = getRun(sel.a), B = getRun(sel.b);
    if (!A || !B || A.path === null || B.path === null) return null;

    let pa = A.path, oa = A.start + sel.a.k, pb = B.path, ob = B.start + sel.b.k;
    if (pa === pb) {
      if (ob < oa) [oa, ob] = [ob, oa];
      return { kind: "same", pa, oa, pb, ob };
    }
    if (sameContainer(pa, pb)) {
      const idx = (p) => +p.match(/(\d+)$/)[1];
      if (idx(pb) < idx(pa)) [pa, oa, pb, ob] = [pb, ob, pa, oa];
      return { kind: "siblings", pa, oa, pb, ob };
    }
    // Scattered (e.g. across table cells): decompose the selection into one
    // covered range per touched Document-story paragraph, in document order.
    // Text is removed, cell/paragraph structure stays (Word-like clearing).
    const ranges = [];
    const byPath = new Map();
    for (const h of allHits()) {
      if (h.path === null || h.start === null || !h.path.startsWith("d/")) continue;
      const cs = chars(h.text);
      const ref = { page: h.page, idx: h.id };
      if (cmpPos({ ...ref, k: cs.length }, sel.a) < 0 || cmpPos({ ...ref, k: 0 }, sel.b) > 0) continue;
      const k1 = h.page === sel.a.page && h.id === sel.a.idx ? sel.a.k : 0;
      const k2 = h.page === sel.b.page && h.id === sel.b.idx ? sel.b.k : cs.length;
      if (k2 <= k1) continue;
      let r = byPath.get(h.path);
      if (!r) { r = { path: h.path, start: h.start + k1, end: h.start + k2 }; byPath.set(h.path, r); ranges.push(r); }
      else { r.start = Math.min(r.start, h.start + k1); r.end = Math.max(r.end, h.start + k2); }
    }
    if (!ranges.length) return null;
    return { kind: "scatter", ranges };
  }

  function edit(fn) {
    const t = performance.now();
    try {
      const json = fn();
      apply(json, performance.now() - t);
    } catch (err) {
      report(`error: ${err}`);
    }
  }

  function typeText(s) {
    if (!caret) return;
    edit(() => {
      const json = conv.insert(caret.path, caret.off, s);
      caret.off += chars(s).length;
      return json;
    });
  }

  function backspace() {
    if (!caret || caret.off === 0) return;
    edit(() => {
      const json = conv.delete(caret.path, caret.off);
      caret.off -= 1;
      return json;
    });
  }

  function deleteSel() {
    const r = selRange();
    if (!r) return;
    edit(() => {
      const json = r.kind === "scatter"
        ? conv.delete_ranges(JSON.stringify(r.ranges))
        : conv.delete_selection(r.pa, r.oa, r.pb, r.ob);
      caret = r.kind === "scatter"
        ? { path: r.ranges[0].path, off: r.ranges[0].start }
        : { path: r.pa, off: r.oa };
      sel = null;
      return json;
    });
  }

  function replaceSelWith(s) {
    const r = selRange();
    if (!r) return;
    edit(() => {
      // One wasm call = one undo entry for the whole replacement.
      const json = r.kind === "scatter"
        ? conv.replace_ranges(JSON.stringify(r.ranges), s)
        : conv.replace_selection(r.pa, r.oa, r.pb, r.ob, s);
      const at = r.kind === "scatter"
        ? { path: r.ranges[0].path, off: r.ranges[0].start }
        : { path: r.pa, off: r.oa };
      caret = { path: at.path, off: at.off + chars(s).length };
      sel = null;
      return json;
    });
  }

  // "d/8.1.0.0" -> "d/8.1.0.1", "h/rId1/0" -> "h/rId1/1": a split's tail is
  // always the next sibling, so bump the final path segment.
  function siblingPath(path, delta) {
    const m = path.match(/^(.*?)(\d+)$/);
    if (!m) return null;
    const n = +m[2] + delta;
    return n < 0 ? null : m[1] + n;
  }

  function enterKey() {
    if (!caret) return;
    edit(() => {
      const json = conv.split(caret.path, caret.off);
      caret = { path: siblingPath(caret.path, +1), off: 0 };
      return json;
    });
  }

  function mergePrev() {
    if (!caret) return;
    const prevPath = siblingPath(caret.path, -1);
    if (prevPath == null) return;
    const prevText = conv.paragraph_text_at(prevPath);
    if (prevText == null) return; // previous sibling is a table or missing
    const prevLen = chars(prevText).length;
    edit(() => {
      const json = conv.merge(caret.path);
      caret = { path: prevPath, off: prevLen };
      return json;
    });
  }

  function toggleFmt(f) {
    const ranges = selectionRanges();
    if (!ranges || !ranges.length) { report("select some text first (Ctrl+B/I/U)"); return; }
    edit(() => {
      const json = conv.toggle_ranges(JSON.stringify(ranges), f);
      sel = null;
      const last = ranges[ranges.length - 1];
      caret = { path: last.path, off: last.end };
      return json;
    });
  }

  function insertFootnote() {
    if (!caret || !caret.path.startsWith("d/")) { report("각주는 본문에서만 삽입"); return; }
    edit(() => {
      const json = conv.insert_footnote(caret.path, caret.off);
      const id = conv.last_note_id();
      caret = id == null ? null : { path: `fn/${id}/0`, off: 0 };
      sel = null;
      return json;
    });
  }

  function deleteFootnote() {
    if (!caret || !caret.path.startsWith("fn/")) { report("각주 안에 캐럿을 두고 Ctrl+Alt+D"); return; }
    edit(() => {
      const json = conv.delete_footnote(caret.path);
      caret = null;
      sel = null;
      return json;
    });
  }

  function insertEndnote() {
    if (!caret || !caret.path.startsWith("d/")) { report("미주는 본문에서만 삽입"); return; }
    edit(() => {
      const json = conv.insert_endnote(caret.path, caret.off);
      const id = conv.last_note_id();
      caret = id == null ? null : { path: `en/${id}/0`, off: 0 };
      sel = null;
      return json;
    });
  }

  function deleteEndnote() {
    if (!caret || !caret.path.startsWith("en/")) { report("미주 안에 캐럿을 두고 Ctrl+Alt+D"); return; }
    edit(() => {
      const json = conv.delete_endnote(caret.path);
      caret = null;
      sel = null;
      return json;
    });
  }

  // Ctrl+Alt+D deletes whichever note the caret sits in.
  function deleteNote() {
    if (caret && caret.path.startsWith("en/")) deleteEndnote();
    else deleteFootnote();
  }

  function forwardDelete() {
    const len = chars(conv.paragraph_text_at(caret.path) || "").length;
    if (caret.off >= len) {
      // End of paragraph: pull the next sibling paragraph up (forward merge).
      const nextPath = siblingPath(caret.path, +1);
      if (nextPath == null || conv.paragraph_text_at(nextPath) == null) return;
      const keep = { ...caret };
      edit(() => {
        const json = conv.merge(nextPath);
        caret = keep; // the merge lands in our paragraph; offset unchanged
        return json;
      });
      return;
    }
    edit(() => {
      const json = conv.delete(caret.path, caret.off + 1);
      return json; // caret offset unchanged
    });
  }

  // Home/End relative to a position's visual line: among hits of the same
  // paragraph on the same baseline, the smallest or largest offset.
  function lineEdgeOff(pos, end) {
    const vis = visFor(pos);
    if (!vis) return end ? chars(conv.paragraph_text_at(pos.path) || "").length : 0;
    const { hit: h } = vis;
    let bestOff = null;
    for (const cand of pageHits[h.page - 1] || []) {
      if (cand.path !== pos.path || cand.start === null) continue;
      if (Math.abs(cand.y - h.y) > 0.4 * h.size) continue;
      const lo = cand.start, hi = cand.start + chars(cand.text).length;
      const v = end ? hi : lo;
      if (bestOff === null || (end ? v > bestOff : v < bestOff)) bestOff = v;
    }
    return bestOff;
  }

  function caretToLineEdge(end) {
    const off = lineEdgeOff(caret, end);
    if (off !== null) { caret.off = off; drawCaret(); report(); }
  }

  // Select from the first to the last hit run of the document (display and
  // copy; range edits still require compatible endpoints).
  function selectAll() {
    let first = null, last = null;
    for (let pg = 0; pg < pageHits.length; pg++) {
      for (const h of pageHits[pg] || []) {
        if (h.adv.length === 0) continue;
        const ref = { page: h.page, idx: h.id };
        if (!first) first = { ...ref, k: 0 };
        last = { ...ref, k: h.adv.length };
      }
    }
    if (!first || !last) return;
    sel = { a: first, b: last };
    caret = null;
    drawCaret(); drawSelection(); report();
  }

  function doUndo() { edit(() => { const j = conv.undo(); caret = null; sel = null; return j; }); }
  function doRedo() { edit(() => { const j = conv.redo(); caret = null; sel = null; return j; }); }

  document.addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.target === findq || e.target === replq || e.target.id === "fontsize") return;
    const ctrl = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (ctrl && !e.altKey && key === "f") { e.preventDefault(); openFind(); return; }
    if (ctrl && !e.altKey && key === "h") {
      e.preventDefault();
      findbar.hidden = false;
      runFind(true);
      replq.focus();
      replq.select();
      return;
    }
    if (e.key === "Escape" && !findbar.hidden) { e.preventDefault(); closeFind(); return; }
    if (ctrl && key === "c") { e.preventDefault(); copySelection(); return; }
    if (ctrl && key === "x") { e.preventDefault(); cutSelection(); return; }
    if (ctrl && key === "a") { e.preventDefault(); selectAll(); return; }
    if (ctrl && key === "z" && !e.shiftKey) { e.preventDefault(); doUndo(); return; }
    if (ctrl && (key === "y" || (key === "z" && e.shiftKey))) { e.preventDefault(); doRedo(); return; }
    if (ctrl && e.altKey && key === "f") { e.preventDefault(); insertFootnote(); return; }
    if (ctrl && e.altKey && key === "e") { e.preventDefault(); insertEndnote(); return; }
    if (ctrl && e.altKey && key === "d") { e.preventDefault(); deleteNote(); return; }
    if (ctrl && (key === "b" || key === "i" || key === "u")) { e.preventDefault(); toggleFmt(key); return; }
    if (ctrl && !e.altKey && (key === "l" || key === "e" || key === "r")) {
      e.preventDefault();
      alignSelection(key === "l" ? "l" : key === "e" ? "c" : "r");
      return;
    }
    if (ctrl || e.altKey) return;
    if (e.key.length === 1) {
      e.preventDefault();
      if (selRange()) replaceSelWith(e.key);
      else if (caret) typeText(e.key);
    } else if (e.key === "Backspace") {
      e.preventDefault();
      if (selRange()) deleteSel();
      else if (caret && caret.off === 0) mergePrev();
      else if (caret) backspace();
    } else if (e.key === "Delete") {
      e.preventDefault();
      if (selRange()) deleteSel();
      else if (caret) forwardDelete();
    } else if (e.key === "Enter") {
      e.preventDefault();
      enterKey();
    } else if (e.key === "Home" && !e.shiftKey && caret) { e.preventDefault(); caretToLineEdge(false); }
    else if (e.key === "End" && !e.shiftKey && caret) { e.preventDefault(); caretToLineEdge(true); }
    else if (e.shiftKey && /^(Arrow(Left|Right|Up|Down)|Home|End)$/.test(e.key)) {
      e.preventDefault();
      extendSelection(e.key);
    }
    else if (e.key === "ArrowLeft" && sel) { e.preventDefault(); collapseSelection(false); }
    else if (e.key === "ArrowRight" && sel) { e.preventDefault(); collapseSelection(true); }
    else if (e.key === "ArrowLeft" && caret) { e.preventDefault(); caret.off = Math.max(0, caret.off - 1); drawCaret(); report(); }
    else if (e.key === "ArrowRight" && caret) { e.preventDefault(); caret.off += 1; drawCaret(); report(); }
    else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && caret) {
      e.preventDefault();
      moveCaretLine(e.key === "ArrowDown" ? +1 : -1);
    }
  });

  // Move the caret one visual line up or down: from its current on-page
  // position, pick the nearest hit on the closest baseline in that
  // direction (crossing to the neighboring page when needed).
  function moveCaretLine(dir) {
    const target = lineTarget(caret, dir);
    if (!target) return;
    caret = target;
    sel = null;
    drawSelection();
    drawCaret();
    report();
  }

  // The story prefix ("d", "h", "f", "fn", "en") of a hit path, or null.
  function storyOf(path) {
    const m = path === null ? null : path.match(/^(d|h|f|fn|en)\//);
    return m ? m[1] : null;
  }

  // The (path, off) one visual line above or below `pos`, or null. Only
  // lines of the same story count: arrowing down from the last body line
  // of a page skips headers/footers/notes and lands on the next page's body.
  function lineTarget(pos, dir) {
    const vis = visFor(pos);
    if (!vis) return null;
    const { hit: h, k } = vis;
    const story = storyOf(h.path);
    const cx = h.x + cum(h, k);
    const half = 0.4 * h.size; // same-baseline tolerance
    let bestLine = null;
    const consider = (cand, yRef) => {
      if (storyOf(cand.path) !== story) return;
      const dy = dir > 0 ? cand.y - yRef : yRef - cand.y;
      if (dy <= half) return; // same line or wrong direction
      if (bestLine === null || dy < bestLine - 1e-6) bestLine = dy;
    };
    // Pass 1: find the nearest baseline in the direction (same page first,
    // then the neighboring page treated as "beyond the edge").
    const pages = [h.page];
    if (dir > 0 && pageHits[h.page]) pages.push(h.page + 1);
    if (dir < 0 && h.page > 1) pages.push(h.page - 1);
    const yRefFor = (pg) => pg === h.page ? h.y : (dir > 0 ? -1e9 : 1e9);
    let target = null;
    for (const pg of pages) {
      bestLine = null;
      for (const cand of pageHits[pg - 1] || []) consider(cand, yRefFor(pg));
      if (bestLine === null) continue;
      // Pass 2: on that baseline, nearest x.
      let best = null;
      for (const cand of pageHits[pg - 1] || []) {
        if (storyOf(cand.path) !== story) continue;
        const dy = dir > 0 ? cand.y - yRefFor(pg) : yRefFor(pg) - cand.y;
        if (Math.abs(dy - bestLine) > half) continue;
        const x1 = cand.x, x2 = cand.x + width(cand);
        const dx = cx < x1 ? x1 - cx : cx > x2 ? cx - x2 : 0;
        if (best === null || dx < best.dx) best = { cand, dx };
      }
      if (best) { target = best.cand; break; }
    }
    if (!target || target.path === null) return null;
    if (!/^(d|h|f|fn|en)\//.test(target.path)) return null;
    let kk = 0, xx = target.x;
    for (const a of target.adv) { if (cx < xx + a / 2) break; xx += a; kk++; }
    return { path: target.path, off: (target.start ?? 0) + kk };
  }

  // ---- IME composition (Korean etc.) --------------------------------------

  const ime = document.getElementById("ime");
  let comp = null;

  function applyComp(data) {
    if (!comp || !caret) return;
    edit(() => {
      const json = conv.replace_range(caret.path, comp.base, comp.base + comp.len, data);
      comp.len = chars(data).length;
      caret.off = comp.base + comp.len;
      return json;
    });
  }

  // Keep whatever preedit is on screen and close the undo unit — used when
  // the user clicks away mid-composition. The IME's own later events find
  // comp === null and do nothing; blur/refocus resets the OS composition.
  function finalizeComposition() {
    if (!comp) return;
    comp = null;
    conv.end_composition();
    ime.value = "";
    ime.blur();
    drawPreedit();
  }

  ime.addEventListener("compositionstart", () => {
    const r = selRange();
    conv.begin_composition(); // one undo unit: selection removal + preedit
    if (r) deleteSel();
    if (caret) comp = { base: caret.off, len: 0 };
    else conv.end_composition();
  });
  ime.addEventListener("compositionupdate", (e) => applyComp(e.data || ""));
  ime.addEventListener("compositionend", (e) => {
    applyComp(e.data || "");
    comp = null;
    ime.value = "";
    conv.end_composition();
    drawPreedit();
  });

  // ---- load ----------------------------------------------------------------

  document.getElementById("demo").onclick = () => {
    conv.load_demo();
    const t = performance.now();
    apply(conv.render(), performance.now() - t);
  };

  document.getElementById("save").onclick = () => {
    try {
      const bytes = conv.save_docx();
      const blob = new Blob([bytes], {
        type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "rdoc-edited.docx";
      a.click();
      URL.revokeObjectURL(a.href);
      report(`saved ${bytes.length} bytes`);
    } catch (err) {
      report(`save error: ${err}`);
    }
  };

  document.getElementById("file").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    conv.load_docx(new Uint8Array(await f.arrayBuffer()));
    const t = performance.now();
    apply(conv.render(), performance.now() - t);
  };

  // Deterministic hooks for automated testing.
  window.__t = {
    clickAt,
    type: typeText,
    backspace: () => {
      if (caret && caret.off === 0) mergePrev();
      else backspace();
    },
    enter: enterKey,
    deleteSel,
    replaceSel: replaceSelWith,
    toggle: toggleFmt,
    undo: doUndo,
    redo: doRedo,
    paraTexts: () => conv.paragraph_texts(),
    textAt: (p) => conv.paragraph_text_at(p),
    pathOrder: (p) => conv.path_order(p),
    saveDocx: () => conv.save_docx(),
    insertFootnote,
    deleteFootnote,
    insertEndnote,
    deleteEndnote,
    deleteNote,
    loadBytes: (bytes) => {
      conv.load_docx(bytes);
      const t0 = performance.now();
      caret = null; sel = null;
      apply(conv.render(), performance.now() - t0);
    },
    simIme: (steps) => {
      ime.focus();
      ime.dispatchEvent(new CompositionEvent("compositionstart"));
      for (const s of steps.slice(0, -1))
        ime.dispatchEvent(new CompositionEvent("compositionupdate", { data: s }));
      ime.dispatchEvent(new CompositionEvent("compositionend", { data: steps[steps.length - 1] }));
    },
    // Step-wise composition, so tests can inspect state between events.
    imeStart: () => {
      ime.focus();
      ime.dispatchEvent(new CompositionEvent("compositionstart"));
    },
    imeUpdate: (s) => ime.dispatchEvent(new CompositionEvent("compositionupdate", { data: s })),
    imeEnd: (s) => ime.dispatchEvent(new CompositionEvent("compositionend", { data: s })),
    select: (page, x1, y1, x2, y2) => {
      const p = findHit(page, x1, y1), q = findHit(page, x2, y2);
      if (!p || !q) return null;
      sel = orderSel(
        { page: p.hit.page, idx: p.hit.id, k: p.k },
        { page: q.hit.page, idx: q.hit.id, k: q.k },
      );
      caret = null;
      drawCaret(); drawSelection(); report();
      return selectedText();
    },
    copy: () => { copySelection(); return lastCopied; },
    cut: () => { cutSelection(); return lastCopied; },
    selText: selectedText,
    setZoom: (z) => { zoom = z; applyZoom(); },
    loadUrl: async (u) => {
      const b = new Uint8Array(await (await fetch(u)).arrayBuffer());
      conv.load_docx(b);
      const t = performance.now();
      apply(conv.render(), performance.now() - t);
    },
    hits: (page) => pageHits[page - 1] || [],
    dirtyCount: () => dirtyPages.size,
    openFind,
    closeFind,
    findQuery: (q) => { findq.value = q; runFind(false); },
    findNext: () => gotoFind(1),
    findPrev: () => gotoFind(-1),
    replaceWith: (q) => { replq.value = q; replaceCurrent(); },
    replaceAllWith: (q) => { replq.value = q; replaceAll(); },
    paste: doPaste,
    align: alignSelection,
    tableOp,
    fontSize: applyFontSize,
    fmtOn: (ranges, f) => conv.ranges_format_on(JSON.stringify(ranges), f),
    thumbs: () => ({
      open: !thumbsEl.hidden,
      count: thumbsEl.children.length,
      pending: thumbDirty.size,
      withSrc: [...thumbsEl.querySelectorAll("img")].filter((i) => i.src).length,
    }),
    toggleThumbs: () => document.getElementById("thumbtoggle").click(),
    selRanges: selectionRanges,
    findState: () => ({
      open: !findbar.hidden,
      count: findMatches.length,
      cur: findCur,
      hl: document.querySelectorAll(".findhl").length,
    }),
    state: () => ({
      caret, sel, lastMs, lastDelta, zoom,
      mapped: allHits().filter(h => h.path !== null).length,
      total: allHits().length,
    }),
  };
</script>
