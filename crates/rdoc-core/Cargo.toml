[package]
name = "rdoc-core"
version = "0.1.0"
edition = "2024"
publish = false

# rdoc-core: the SVG renderer, hit testing, and editing operations behind
# the rdoc web editor, on top of rdocx's layout output. Depends on the
# emptinessform/rdocx fork (branch svg-poc-0.8, rev pinned) carrying the
# editor APIs and dense-form layout fixes not yet upstream.
#
# Build from the workspace root:
#   native tools:  cargo run --release -p rdoc-core --bin poc
#   wasm bundle:   wasm-pack build crates/rdoc-core --release --target web #                    --out-dir ../../web/pkg -- --no-default-features

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poc"
path = "src/main.rs"

[features]
default = ["native"]
native = ["rdocx/system-fonts"]

[dependencies]
rdocx = { git = "https://github.com/emptinessform/rdocx", rev = "a06993f38954d677c6091088b403f4415f3bfbdb", default-features = false }
oxml-layout = { git = "https://github.com/emptinessform/rdocx", rev = "a06993f38954d677c6091088b403f4415f3bfbdb", default-features = false }
ttf-parser = "0.25"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"



